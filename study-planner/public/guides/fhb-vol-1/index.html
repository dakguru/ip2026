<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Handbook Vol-I Guide</title>

    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Prop-types (Required for Recharts UMD build) -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Recharts (Fixed version) -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const {
            PieChart, Pie, Cell, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, LineChart, Line
        } = Recharts;

        // --- DATA CONSTANTS ---
        const chapters = [
            {
                id: 1,
                title: "Chapter I: Definitions",
                icon: "BookOpen",
                color: "bg-blue-500",
                content: [

                    {
                        rule: "Rule 2", title: "Definitions", items: [
                            { term: "Accounts Officer", def: "Head of an Office of Accounts" },
                            { term: "The Bank", def: "RBI, SBI acting as agent, or other appointed agencies" },
                            { term: "Head of Circle (HOC)", def: "Chief Postmaster General (CPMG)" },
                            { term: "Head of Department (HOD)", def: "Declared under S.R. 2(10) (DG is HOD of Posts)" },
                            { term: "Treasury", def: "Includes sub-Treasury" }
                        ]
                    },
                    { rule: "Rule 3", title: "Head of Office", text: "HOD can declare any Gazetted Officer as Head of Office if more than one exists." }
                ]
            },
            {
                id: 2,
                title: "Chapter II: General Principles",
                icon: "Scale",
                color: "bg-indigo-500",
                content: [
                    { rule: "Rule 4-6", title: "Receipt of Money", text: "All money received must be paid in full without delay into Treasury/Bank. Postmasters remit surplus to Bank/Treasury. All moneys go to 'Public Account'." },
                    { rule: "Rule 8", title: "Receipts", text: "Head of Office must issue receipt (ACG-67) signed after entry in Cash Book." },
                    { rule: "Rule 12", title: "Withdrawals", text: "Disbursing Officer can permit withdrawal for Govt dues, private claims, loans/advances." },
                    { rule: "Rule 15", title: "Expenditure", text: "No expenditure without sanction by competent authority." },
                    { rule: "Rule 17", title: "Bill Correction", text: "Disbursing officer can correct arithmetical mistakes or disallow doubtful items and pay the remainder." },
                    { rule: "Rule 18", title: "Endorsements", text: "Bills are non-negotiable. Only one endorsement allowed in favor of specific party. Bankers/Messengers allow second endorsement for collection." },
                    { rule: "Rule 24-27", title: "Arrear Claims", highlight: true, text: "Claims > 2 years require Circle Account Office authority. Claims > 2 years (up to Rs. 500) paid without pre-check. Claims > 6 years need HOD approval." },
                    { rule: "Rule 37-45", title: "Bill Checks", text: "Verify signature, admissibility, accuracy. Pay orders valid for 7 days. Vouchers must be cancelled after payment." },
                    { rule: "Rule 47", title: "Rounding Off", text: "50 paise and above -> Next Rupee. Less than 50 paise -> Ignored. Transactions involving cash rounded to nearest rupee." },
                    { rule: "Rule 52", title: "Defalcation & Losses", text: "Report immediately to superior and Accounting Authority. Petty losses (< Rs. 10,000) need not be reported to Audit unless characteristic of system failure." }
                ]
            },
            {
                id: 3,
                title: "Chapter III: System of Accounts",
                icon: "Activity",
                color: "bg-emerald-500",
                content: [
                    { rule: "Rule 70", title: "Classification Structure", text: "Receipts and Expenditure recorded under Major Heads. Examples: 1201 (Postal Receipts), 3201 (Postal Services Exp)." },
                    { rule: "Rule 71", title: "Commercial Dept", text: "Dept of Posts is a commercial department. Capital cost recorded under 5201." },
                    { rule: "Rule 76", title: "Cash Account", text: "Head Post Office submits monthly cash account to Circle Account Office covering all HPO/SO/BO transactions." },
                    { rule: "Rule 79", title: "Revenue Sources", text: "Sale of stamps, postage, MO commission, IPO commission, etc." }
                ]
            },
            {
                id: 4,
                title: "Chapter IV: Relation with Audit",
                icon: "Eye",
                color: "bg-red-500",
                content: [
                    { rule: "Rule 80", title: "Audit Structure", text: "23 Circle Postal Account Offices (GM/DA/DDA). External Audit by P&T Audit (C&AG)." },
                    { rule: "Rule 82", title: "Objections", text: "Reply to objection statement within a fortnight." },
                    { rule: "Rule 84", title: "Recoveries", text: "Ordinarily not exceeding 1/3rd of pay." },
                    {
                        rule: "Rule 95", title: "Inspection Reports", items: [
                            { term: "Part I", def: "Introductory, Outstanding objections, Persistent irregularities" },
                            { term: "Part II", def: "Section A: Major irregularities (Recoveries/Losses). Section B: Minor irregularities." },
                            { term: "Part III", def: "Test audit note, minor procedural errors." }
                        ]
                    }
                ]
            },
            {
                id: 5,
                title: "Chapter V: Cash",
                icon: "DollarSign",
                color: "bg-green-600",
                content: [
                    { rule: "Rule 99", title: "Personal Responsibility", text: "Every Govt servant personally responsible for Govt money. Private cash must NOT be mixed with public cash." },
                    { rule: "Rule 100", title: "Definition of Cash", text: "Legal tender coins, currency/bank notes, cheques, demand drafts. EXCLUDES: Stamps, stationery, deposit receipts, bonds." },
                    { rule: "Rule 102", title: "Custody", text: "Strong chest with two locks of different patterns. Keys with different custodians. Chest opened only when both present." },
                    { rule: "Rule 110", title: "Cash Book", text: "Maintained by every officer receiving/paying money. SPM/BPM exempted (use other records). Page count certificate on first page." },
                    { rule: "Rule 115", title: "Corrections", text: "Erasures/Overwriting FORBIDDEN. Correct by striking out in red ink and inserting correct entry with dated initial." },
                    { rule: "Rule 120", title: "Verification", text: "Actual balance counted and verified on last working day of each period. Certificate of count recorded." }
                ]
            },
            {
                id: 6,
                title: "Chapter VI: Supply of Funds",
                icon: "RefreshCw",
                color: "bg-teal-500",
                content: [
                    { rule: "Rule 124", title: "Cash Balance Limits", text: "First-class HPO: Fixed by Head of Circle. Other Offices: Fixed by Div Head." },
                    { rule: "Rule 128", title: "Drawing Funds", text: "HPO draws from Treasury/Bank via Cheque/Voucher. ACG-11 (Memo), ACG-12 (Voucher)." },
                    { rule: "Rule 130", title: "Cheques", text: "Minimum amount Rs. 100. All cheques crossed 'Not Negotiable'." },
                    { rule: "Rule 137", title: "Remittances", text: "Between HPOs using Remittance Advice & Acknowledgement (ACG-15). Enclosed in cash bag, weighed, sealed." },
                    { rule: "Rule 148", title: "Cheque Books", text: "Supplied by Circle Account Officer. Only one book in use at a time." }
                ]
            },
            {
                id: 7,
                title: "Chapter VIII: Pay & Allowances",
                icon: "UserCheck",
                color: "bg-purple-600",
                content: [
                    { rule: "Rule 169", title: "Due Date", text: "Last working day of the month. March pay paid on 1st April working day." },
                    { rule: "Rule 174", title: "Attachment", text: "Court orders. Maintenance: 1/3 exempt. Others: First 1000 + 2/3 of remainder exempt." },
                    { rule: "Rule 180", title: "First Payment", text: "Supported by Last Pay Certificate (LPC). Medical certificate required." },
                    { rule: "Rule 188", title: "Death of Payee", text: "Pay claimable for the day of death. 'Day' means calendar day." },
                    { rule: "Rule 195", title: "Honorarium", text: "Claims processed via CSI/SAP. Sanction copy to GM(PAF)." }
                ]
            },
            {
                id: 8,
                title: "Chapter IX: Establishment",
                icon: "Users",
                color: "bg-orange-500",
                content: [
                    { rule: "Rule 205", title: "Register", text: "Register of Sanctioned Establishment (ACG-19a) maintained by Head of Office." },
                    { rule: "Rule 207", title: "Date of Birth", text: "Declared on Christian era. Alteration only within 5 years of entry for genuine mistakes." },
                    { rule: "Rule 209", title: "Service Book", text: "Maintained for Non-Gazetted. Cost borne by Govt. Verification every year (Rule 210)." },

                id: 9,
                title: "Chapter X: Contingent Charges",
                icon: "Layers",
                color: "bg-pink-500",
                content: [
                    { rule: "Rule 241", title: "Definition", text: "Incidental expenses for management of office. Excludes Pay, Works, Stock." },

                        rule: "Rule 243", title: "Classes", items: [
                            { term: "Contract", def: "Lump sum annually, no further sanction." },
                            { term: "Special", def: "Requires previous sanction of superior." },
                            { term: "Countersigned", def: "Approval by controlling authority after payment." },
                            { term: "Fully Vouched", def: "Head of Office authority, no countersignature needed." }
                        ]
                    },
                    { rule: "Rule 252", title: "Permanent Advance", text: "For petty contingent expenses (Imprest). Responsible for safe custody." }
                ]
            },
            {
                id: 10,
                title: "Chapter XII: Loans & Advances",
                icon: "CreditCard",
                color: "bg-cyan-600",
                content: [
                    { rule: "Rule 300", title: "Types", text: "Personal Computer Advance, HBA. Interest bearing." },
                    { rule: "Rule 311", title: "Tour Advance", text: "Covers personal traveling expenses for a month. Adjustment within 15 days of completion." },
                    { rule: "Rule 315", title: "PC Advance Recovery", text: "Max 150 installments. Total recoveries < 50% of emoluments." }
                ]
            }
        ];

        const chartDataHeads = [
            { name: 'Postal Receipts', value: 1201, color: '#0088FE' },
            { name: 'Postal Services Exp', value: 3201, color: '#00C49F' },
            { name: 'Capital Outlay', value: 5201, color: '#FFBB28' },
            { name: 'Postal Deposits', value: 8446, color: '#FF8042' },

        const investigationLimits = [

            { authority: 'Divisional Head', limit: 500000 },
            { authority: 'Director/PMG', limit: 1000000 },
            { authority: 'PMG/CPMG', limit: 1000001 }, // Represents > 10L
        ];

        const quizQuestions = [
            { q: "Which form is used for the Receipt of Money?", options: ["ACG-67", "ACG-11", "ACG-18", "TR-5"], correct: 0 },

            { q: "Pay for the month of March is paid on:", options: ["31st March", "Last working day of March", "1st working day of April", "10th April"], correct: 2 },

            </svg>

            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
            </svg>
        );

        const Eye = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>

            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>

            Layers,

                    <div className="px-4 py-2 text-xs font-semibold text-slate-500 uppercase tracking-wider mt-4">Tools</div>

                    {[
                        { label: "Chapters", value: "10", icon: "BookOpen", color: "bg-blue-500" },
                        { label: "Rules", value: "400+", icon: "FileText", color: "bg-green-500" },
                        { label: "Audits", value: "3", icon: "Eye", color: "bg-purple-500" },

                                <h3 className="text-lg md:text-2xl font-bold text-slate-800">{stat.value}</h3>
                            </div>
                        </div>
                    ))}
                </div>

                            <RenderIcon name="Activity" className="mr-2 text-blue-500" /> Accounting (Major Heads)
                        </h3>
                        <div className="h-48 md:h-64">
                            <ResponsiveContainer width="100%" height="100%">
                                <PieChart>
                                    <Pie
                                        data={chartDataHeads}
                                        cx="50%"
                                        cy="50%"
                                        innerRadius={40}
                                        outerRadius={70}
                                        paddingAngle={5}
                                        dataKey="value"
                                    >
                                        {chartDataHeads.map((entry, index) => (
                                            <Cell key={`cell-${index}`} fill={entry.color} />
                                        ))}
                                    </Pie>
                                    <Tooltip />
                                    <Legend wrapperStyle={{ fontSize: '10px' }} />
                                </PieChart>
                            </ResponsiveContainer>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-lg p-4 md:p-6">
                        <h3 className="text-lg md:text-xl font-bold text-slate-800 mb-4 flex items-center">
                            <RenderIcon name="Search" className="mr-2 text-purple-500" /> Investigation Limits
                        </h3>
                        <div className="h-48 md:h-64">
                            <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={investigationLimits} margin={{ top: 5, right: 5, bottom: 5, left: -20 }}>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                    <XAxis dataKey="authority" hide />
                                    <YAxis tick={{ fontSize: 10 }} />
                                    <Tooltip cursor={{ fill: 'transparent' }} />
                                    <Bar dataKey="limit" name="Limit (Rs.)" radius={[4, 4, 0, 0]}>
                                        {investigationLimits.map((entry, index) => (
                                            <Cell key={`cell-${index}`} fill={['#60A5FA', '#34D399', '#FBBF24', '#F87171'][index]} />
                                        ))}
                                    </Bar>
                                </BarChart>
                            </ResponsiveContainer>
                        </div>
                        <div className="grid grid-cols-4 text-[10px] text-slate-500 mt-2 text-center gap-1">
                            <span>Insp/ASP</span>
                            <span>Div Head</span>
                            <span>Dir/PMG</span>
                            <span>CPMG</span>
                        </div>
                    </div>
                </div>

                <div className="mt-6 md:mt-8 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl shadow-lg p-6 md:p-8 text-white text-center md:text-left">
                    <h3 className="text-xl md:text-2xl font-bold mb-2">Ready to master?</h3>
                    <p className="mb-6 opacity-90 text-sm md:text-base">Test your knowledge with our interactive quiz.</p>
                    <button
                        onClick={() => { setActiveTab('quiz'); setView('quiz'); }}
                        className="bg-white text-indigo-600 px-6 py-2 rounded-full font-bold hover:bg-indigo-50 transition-colors shadow-md w-full md:w-auto"
                    >
                        Start Quiz
                    </button>
                </div>
            </div>
        );

        const ChapterView = ({ chapterId }) => {
            const chapter = chapters.find(c => c.id === chapterId);
            const [searchTerm, setSearchTerm] = useState("");

            if (!chapter) return <div>Chapter not found</div>;

            const filteredContent = chapter.content.filter(item =>
                item.rule.toLowerCase().includes(searchTerm.toLowerCase()) ||
                item.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                (item.text && item.text.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            return (
                <div className="p-4 md:p-8 animate-fade-in max-w-6xl mx-auto pb-24">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <div className="flex items-center">
                            <div className={`p-2 md:p-3 rounded-lg ${chapter.color} text-white mr-3 shadow-lg shrink-0`}>
                                <RenderIcon name={chapter.icon} size={24} className="md:w-8 md:h-8" />
                            </div>
                            <div>
                                <h2 className="text-2xl md:text-3xl font-bold text-slate-800 leading-tight">{chapter.title}</h2>
                            </div>
                        </div>
                        <div className="relative w-full md:w-auto">
                            <input
                                type="text"
                                placeholder="Search rules..."
                                className="pl-10 pr-4 py-2 rounded-full border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-400 w-full md:w-64"
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                            />
                            <RenderIcon name="Search" className="absolute left-3 top-2.5 text-slate-400" size={18} />
                        </div>
                    </div>

                    <div className="grid grid-cols-1 gap-4 md:gap-6">
                        {filteredContent.map((item, idx) => (
                            <div key={idx} className={`bg-white rounded-xl shadow p-4 md:p-6 border-l-4 ${chapter.color.replace('bg-', 'border-')} card-hover`}>
                                <div className="flex flex-wrap justify-between items-start mb-2 gap-2">
                                    <span className="bg-slate-100 text-slate-600 px-2 py-1 rounded text-[10px] md:text-xs font-bold uppercase tracking-wide">
                                        {item.rule}
                                    </span>
                                    {item.highlight && <span className="bg-red-100 text-red-600 px-2 py-1 rounded-full text-[10px] md:text-xs font-bold">Important</span>}
                                </div>
                                <h3 className="text-lg md:text-xl font-bold text-slate-800 mb-2 md:mb-3">{item.title}</h3>
                                {item.items ? (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
                                        {item.items.map((sub, i) => (
                                            <div key={i} className="bg-slate-50 p-2 md:p-3 rounded border border-slate-100">
                                                <span className="block font-bold text-slate-700 text-sm mb-1">{sub.term}</span>
                                                <span className="text-slate-600 text-xs md:text-sm">{sub.def}</span>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <p className="text-slate-600 text-sm md:text-base leading-relaxed">{item.text}</p>
                                )}
                            </div>
                        ))}
                        {filteredContent.length === 0 && (
                            <div className="text-center py-12 text-slate-400">
                                <RenderIcon name="Search" size={48} className="mx-auto mb-4 opacity-50" />
                                <p>No rules found matching "{searchTerm}"</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Quiz = () => {
            const [currentQ, setCurrentQ] = useState(0);
            const [score, setScore] = useState(0);
            const [showResult, setShowResult] = useState(false);
            const [selected, setSelected] = useState(null);

            const handleAnswer = (idx) => {
                setSelected(idx);
                if (idx === quizQuestions[currentQ].correct) {
                    setScore(s => s + 1);
                }
                setTimeout(() => {
                    if (currentQ < quizQuestions.length - 1) {
                        setCurrentQ(c => c + 1);
                        setSelected(null);
                    } else {
                        setShowResult(true);
                    }
                }, 1000);
            };

            const resetQuiz = () => {
                setCurrentQ(0);
                setScore(0);
                setShowResult(false);
                setSelected(null);
            };

            return (
                <div className="p-4 md:p-8 w-full max-w-2xl mx-auto animate-fade-in min-h-[80vh] flex flex-col justify-start md:justify-center pt-8 md:pt-0">
                    {!showResult ? (
                        <div className="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-100">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-lg md:text-2xl font-bold text-slate-800">Quiz Mode</h2>
                                <span className="text-xs md:text-sm font-bold bg-blue-100 text-blue-600 px-3 py-1 rounded-full">
                                    Q {currentQ + 1}/{quizQuestions.length}
                                </span>
                            </div>
                            <div className="mb-6 md:mb-8">
                                <h3 className="text-lg font-medium text-slate-700 mb-6">{quizQuestions[currentQ].q}</h3>
                                <div className="space-y-3">
                                    {quizQuestions[currentQ].options.map((opt, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => handleAnswer(idx)}
                                            disabled={selected !== null}
                                            className={`w-full text-left p-3 md:p-4 rounded-xl border text-sm md:text-base transition-all ${selected === idx
                                                    ? idx === quizQuestions[currentQ].correct
                                                        ? 'bg-green-100 border-green-500 text-green-700'
                                                        : 'bg-red-100 border-red-500 text-red-700'
                                                    : 'bg-slate-50 border-slate-200 hover:bg-blue-50 hover:border-blue-300'
                                                }`}
                                        >
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="bg-white rounded-2xl shadow-xl p-8 text-center border border-slate-100 mt-10">
                            <div className="w-16 h-16 md:w-20 md:h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                <RenderIcon name="Activity" className="text-green-500" size={32} />
                            </div>
                            <h2 className="text-2xl md:text-3xl font-bold text-slate-800 mb-2">Quiz Completed!</h2>
                            <p className="text-slate-500 mb-6">You scored</p>
                            <div className="text-4xl md:text-5xl font-black text-blue-600 mb-8">{score} / {quizQuestions.length}</div>
                            <button
                                onClick={resetQuiz}
                                className="bg-blue-600 text-white px-8 py-3 rounded-full font-bold hover:bg-blue-700 shadow-lg w-full md:w-auto"
                            >
                                Try Again
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [view, setView] = useState('dashboard');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            return (
                <div className="flex min-h-screen bg-slate-50 text-slate-800">
                    {/* Desktop Sidebar */}
                    <div className="hidden md:block">
                        <Sidebar
                            activeTab={activeTab}
                            setActiveTab={setActiveTab}
                            setView={setView}
                            isMobile={false}
                        />
                    </div>

                    {/* Mobile Sidebar/Drawer */}
                    {isMobileMenuOpen && (
                        <>
                            <div className="fixed inset-0 bg-black/50 z-20 md:hidden" onClick={() => setIsMobileMenuOpen(false)} />
                            <div className="md:hidden">
                                <Sidebar
                                    activeTab={activeTab}
                                    setActiveTab={setActiveTab}
                                    setView={setView}
                                    isMobile={true}
                                    closeMenu={() => setIsMobileMenuOpen(false)}
                                />
                            </div>
                        </>
                    )}

                    {/* Mobile Header */}
                    <div className="md:hidden fixed top-0 w-full bg-slate-900 text-white z-20 flex justify-between items-center p-4 shadow-md">
                        <div className="flex items-center">
                            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="mr-3">
                                <div className="space-y-1.5">
                                    <span className="block w-6 h-0.5 bg-white"></span>
                                    <span className="block w-6 h-0.5 bg-white"></span>
                                    <span className="block w-6 h-0.5 bg-white"></span>
                                </div>
                            </button>
                            <span className="font-bold text-lg">FHB Guide</span>
                        </div>
                        {/* Optional: Add a logo or other indicator here */}
                    </div>

                    <main className="flex-1 md:ml-64 pt-16 md:pt-0 w-full">
                        {view === 'dashboard' && <Dashboard setActiveTab={setActiveTab} setView={setView} />}
                        {view === 'chapter' && <ChapterView chapterId={activeTab} />}
                        {view === 'quiz' && <Quiz />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
